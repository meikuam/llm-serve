services:
  serve:
    image: ollama/ollama:0.32.1
    ports:
      - "${OLLAMA_PORT}:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_GPU_OVERHEAD: "0"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "64"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NEW_ENGINE: 1
    restart: always
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: "60G"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_DIR}
        target: /root/.ollama
    networks:
      - webui-net  
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: always
    ports:
      - "${WEBUI_PORT}:8080"
    environment:
      OLLAMA_BASE_URL: "http://serve:11434"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_WEBSOCKET_SUPPORT: true
      SEARCH_ENGINE: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "qwen3-embedding:4b"
      WEBUI_URL: "http://${PUBLIC_IP}:${WEBUI_PORT}"
    volumes:
      - type: bind
        source: ./open-webui
        target: /app/backend/data
    depends_on:
      - serve
    networks:
      - webui-net  
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  searxng:
    image: searxng/searxng:latest
    restart: always
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - webui-net 
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  tika:
    image: apache/tika:latest-full
    restart: always
    networks:
      - webui-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_LOG_LEVEL: "info"
      WATCHTOWER_POLL_INTERVAL: "12h"
      WATCHTOWER_LABEL_ENABLE: "true"
  
  file-export-server:
    image: ghcr.io/glissemantv/owui-file-export-server:latest
    restart: always
    environment:
      - FILE_EXPORT_DIR=/file_exports
    ports:
      - "${FILE_EXPORT_PORT}:9003"
    volumes:
      - ./file_exports:/file_exports
    networks:
      - webui-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  owui-mcpo:
    image: ghcr.io/glissemantv/owui-mcpo:latest
    restart: always
    environment:
      - FILE_EXPORT_BASE_URL=http://${PUBLIC_IP}:${FILE_EXPORT_PORT}/files
      - FILE_EXPORT_DIR=/file_exports       
      - PERSISTENT_FILES=true
      - FILES_DELAY=1
      - LOG_LEVEL=INFO
      - OWUI_URL=http://webui:8080 
    ports:
      - "${WEBUI_MCPO_PORT}:8000"
    volumes:
      - ./file_exports:/file_exports
    depends_on:
      - file-export-server
    networks:
      - webui-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  webui-net:
    driver: bridge
