services:
  serve:
    image: ollama/ollama:0.32.1
    ports:
      - "32888:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_GPU_OVERHEAD: "0"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "64"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NEW_ENGINE: 1
    restart: always
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: "60G"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ./ollama
        target: /root/.ollama
    networks:
      - webui-net  

  webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: always
    ports:
      - "32889:8080"
    environment:
      OLLAMA_BASE_URL: "http://serve:11434"
      ENABLE_WEBSOCKET_SUPPORT: true
      SEARCH_ENGINE: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "qwen3-embedding:4b"
    volumes:
      - type: bind
        source: ./open-webui
        target: /app/backend/data
    depends_on:
      - serve
    networks:
      - webui-net  

  searxng:
    image: searxng/searxng:latest
    restart: always
    ports:
      - "32890:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - webui-net 

  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: always
    ports:
      - "32891:9998"
    networks:
      - webui-net

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_LOG_LEVEL: "info"
      WATCHTOWER_POLL_INTERVAL: "12h"

networks:
  webui-net:
    driver: bridge
