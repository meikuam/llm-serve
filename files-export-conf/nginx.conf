worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;


    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stderr;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;

    server {
        listen 80;
        server_name _;

        # ----- Прокси для Open WebUI -----
        location / {
            proxy_pass http://webui:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----- Прокси для файлов с проверкой JWT -----
        location /files/ {
            # Проверяем JWT перед отправкой
            access_by_lua_file /usr/local/openresty/nginx/lua/auth.lua;

            proxy_pass http://file-export-server:9003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Пробрасываем информацию из JWT, если бэкенд её ожидает
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_set_header X-User-Email $http_x_user_email;
        }
    }
}